version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-analytic_gold}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-analytic_gold}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-analytic_gold}"]
      interval: 5s
      timeout: 5s
      retries: 5

  fetcher-api:
    build:
      context: .
      dockerfile: fetcher_api/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ${WEBSITE_HOST_PATH}:/website
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_NAME=gold_analytics
      - DB_USER=postgres
      - DB_PASSWORD=gold_price
      - FRED_API_KEY=${FRED_API_KEY}
      - OLLAMA_HOST=http://host.docker.internal:11434
      - MD_DIR=/app/output
      - GIF_DIR=/app/article_gifs
      - WEBSITE_ROOT=/website
    extra_hosts:
      - "host.docker.internal:host-gateway"

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-analytic_gold}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-analytic_gold}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-changeme-generate-a-random-key}
      - GENERIC_TIMEZONE=Europe/Amsterdam
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      fetcher-api:
        condition: service_started

volumes:
  postgres_data:
  n8n_data:
